<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NACC Exam Prep | PSW Certification Trainer</title>
    <meta name="description" content="Interactive study guide and quiz simulator for the Canadian NACC Personal Support Worker (PSW) final exam. Features 807 tickets, bilingual Ukrainian explanations, custom range quizzes, spaced repetition, offline study, and progress tracking." />
    <meta property="og:title" content="NACC Exam Prep | PSW Certification Trainer" />
    <meta property="og:description" content="Interactive study guide and quiz simulator for the Canadian NACC Personal Support Worker (PSW) final exam. Features 807 tickets, bilingual Ukrainian explanations, custom range quizzes, spaced repetition, offline study, and progress tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B111E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NACC Prep" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      (function() {
        window.__pwaInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__pwaInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
        });
        window.addEventListener('appinstalled', function() {
          window.__pwaInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-app-installed'));
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#EBF0F5] text-slate-900 dark:bg-[#0B111E] dark:text-slate-100 min-h-[100dvh] antialiased selection:bg-sky-500/25">
    <div id="root"></div>
    <!-- Native iOS Taptic Engine Trigger via WebKit Switch Control -->
    <div style="position:fixed;top:0;left:0;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden;z-index:-999;" aria-hidden="true">
      <input type="checkbox" switch id="nacc-ios-haptic-switch" />
      <label for="nacc-ios-haptic-switch" id="nacc-ios-haptic-label"></label>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
